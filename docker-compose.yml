services:
  bootstrap:
    build: . 
    image: d7024e-node:latest
    environment:
      - NODE_PORT=8000
      - IS_BOOTSTRAP=true
      - ADVERTISE_HOST=bootstrap
      - DOCKER_ENV=true
    ports:
      - "8000:8000"
    networks:
      - kademlia_network

  node:
    build: . 
    image: d7024e-node:latest
    environment:
      - NODE_PORT=8001
      - BOOTSTRAP_ADDR=bootstrap:8000
      - DOCKER_ENV=true
    depends_on:
      - bootstrap
    networks:
      - kademlia_network

  interactive:
    build: . 
    image: d7024e-node:latest
    container_name: kademlia-interactive  # Fixed container name
    environment:
      - NODE_PORT=8002
      - BOOTSTRAP_ADDR=bootstrap:8000
      - ADVERTISE_HOST=kademlia-interactive
      - DOCKER_ENV=false
    depends_on:
      - bootstrap
    networks:
      - kademlia_network
    stdin_open: true
    tty: true
    profiles:
      - interactive

networks:
  kademlia_network: